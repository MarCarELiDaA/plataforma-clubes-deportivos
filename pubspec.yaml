name: clubes_deportivos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: 4.14.0
  firebase_auth: 6.6.1
  cloud_firestore: 6.9.0
  google_sign_in: ^7.2.0

  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logofinal1.jpeg
    - assets/images/pistanavales.png
    - assets/images/login_banner.jpeg
    - assets/images/home_hero.jpeg
    - assets/images/hero_club_general.png
    - assets/images/banner_padel.jpeg
    - assets/images/banner_tenis.jpeg
    - assets/images/banner_gym.jpeg
    - assets/images/yo_reservo_alternativo.png
    - assets/images/yo_reservo_logo.png
    - assets/images/gimnasio_ia.png
    - assets/images/padel_ia.png
    - assets/images/tenis_ia.png
    - assets/images/gimnasio_real_2.jpg
    - assets/images/mancuernas.jpg
    - assets/images/padel_real.jpg
    - assets/images/gimnasio_real.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logofinal1.jpeg"
  adaptive_icon_background: "#182B50"
  adaptive_icon_foreground: "assets/images/logofinal1.jpeg"